<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你是后会友期里的谁 · 趣味人格测评</title>
<style>
  :root {
    --bg: #0f0f14;
    --card: #1a1a24;
    --card2: #22222e;
    --accent: #f5c518;
    --accent2: #ff6b6b;
    --text: #e8e8f0;
    --text2: #9a9ab0;
    --radius: 16px;
    --green: #4ade80;
    --blue: #60a5fa;
    --yellow: #fbbf24;
    --orange: #fb923c;
    --purple: #a78bfa;
    --red: #f87171;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }
  .app {
    width: 100%;
    max-width: 560px;
    padding: 20px 16px 40px;
    position: relative;
  }

  /* ====== 封面 ====== */
  #cover {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 92vh;
    text-align: center;
    animation: fadeIn .6s ease;
  }
  .cover-badge {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--accent);
    border: 1px solid rgba(245,197,24,.35);
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .cover-title {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .cover-sub {
    font-size: 16px;
    color: var(--text2);
    margin-bottom: 36px;
    line-height: 1.8;
  }
  .cover-sub em { color: var(--accent); font-style: normal; }
  .cover-names {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 48px;
  }
  .cover-names span {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--card);
    color: var(--text2);
    border: 1px solid #2a2a38;
  }
  .btn-start {
    font-size: 18px;
    font-weight: 700;
    color: #111;
    background: linear-gradient(135deg, var(--accent), #ffd94a);
    border: none;
    padding: 16px 56px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(245,197,24,.3);
    transition: transform .15s, box-shadow .15s;
  }
  .btn-start:active { transform: scale(.96); }
  .cover-meta {
    margin-top: 22px;
    font-size: 12px;
    color: #55556a;
  }

  /* ====== 答题 ====== */
  #quiz { display: none; animation: fadeIn .4s ease; }
  .quiz-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .quiz-progress-text {
    font-size: 13px;
    color: var(--text2);
    font-weight: 600;
  }
  .quiz-progress-text b { color: var(--accent); font-size: 16px; }
  .quiz-pct { font-size: 12px; color: var(--text2); }
  .progress-track {
    height: 8px;
    background: var(--card);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 30px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #ffd94a);
    border-radius: 999px;
    transition: width .3s ease;
  }
  .q-number {
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .q-text {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.55;
    margin-bottom: 28px;
    min-height: 62px;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1.5px solid transparent;
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    user-select: none;
  }
  .option:active { transform: scale(.985); }
  .option:hover { background: var(--card2); }
  .option.selected {
    border-color: var(--accent);
    background: rgba(245,197,24,.08);
  }
  .option .letter {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #2a2a38;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--text2);
    transition: background .15s, color .15s;
  }
  .option.selected .letter {
    background: var(--accent);
    color: #111;
  }
  .option .opt-text {
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
  }
  .quiz-nav {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }
  .btn-nav {
    flex: 1;
    padding: 15px;
    border-radius: var(--radius);
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn-nav:active { transform: scale(.97); }
  .btn-prev {
    background: var(--card);
    color: var(--text2);
    border: 1px solid #2a2a38;
  }
  .btn-next {
    background: linear-gradient(135deg, var(--accent), #ffd94a);
    color: #111;
  }
  .btn-next:disabled {
    opacity: .35;
    cursor: not-allowed;
    background: #3a3a48;
    color: #777;
  }

  /* ====== 结果 ====== */
  #result { display: none; animation: fadeIn .5s ease; }
  .result-hero {
    text-align: center;
    padding: 20px 0 24px;
  }
  .result-label {
    font-size: 13px;
    color: var(--text2);
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .result-name {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 10px;
  }
  .result-tag {
    display: inline-block;
    font-size: 14px;
    padding: 7px 18px;
    border-radius: 999px;
    background: var(--card);
    color: var(--text2);
    border: 1px solid #2a2a38;
  }
  .result-score {
    margin-top: 16px;
    font-size: 13px;
    color: #55556a;
  }
  .result-score b { color: var(--text2); }

  /* 图表 */
  .chart-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 20px;
    margin-top: 24px;
  }
  .chart-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chart-title::before {
    content: '';
    width: 4px;
    height: 16px;
    border-radius: 2px;
    background: var(--accent);
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-name {
    width: 58px;
    flex-shrink: 0;
    font-size: 13px;
    color: var(--text2);
    text-align: right;
  }
  .bar-track {
    flex: 1;
    height: 20px;
    background: #22222e;
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    width: 0%;
    transition: width 1s cubic-bezier(.4,0,.2,1);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
    font-size: 10px;
    font-weight: 700;
    color: rgba(0,0,0,.6);
  }
  .bar-val {
    width: 40px;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    text-align: right;
  }

  /* 内容卡片 */
  .content-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 20px;
    margin-top: 16px;
  }
  .content-card h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .content-card h3 .ico { font-size: 18px; }
  .content-card p {
    font-size: 14.5px;
    line-height: 1.85;
    color: #c8c8d8;
  }
  .content-card ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .content-card li {
    font-size: 14px;
    line-height: 1.7;
    color: #c8c8d8;
    padding-left: 20px;
    position: relative;
  }
  .content-card li::before {
    content: '';
    position: absolute;
    left: 2px;
    top: 9px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .content-card.advice li::before { background: var(--green); }
  .content-card.warn li::before { background: var(--accent2); }

  /* 分享 */
  .share-section {
    margin-top: 28px;
    text-align: center;
  }
  .btn-share {
    font-size: 16px;
    font-weight: 700;
    color: #111;
    background: linear-gradient(135deg, var(--accent), #ffd94a);
    border: none;
    padding: 15px 40px;
    border-radius: 999px;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 8px 24px rgba(245,197,24,.25);
    transition: transform .1s;
  }
  .btn-share:active { transform: scale(.97); }
  .btn-restart {
    margin-top: 12px;
    font-size: 14px;
    color: var(--text2);
    background: transparent;
    border: 1px solid #2a2a38;
    padding: 13px 40px;
    border-radius: 999px;
    cursor: pointer;
    width: 100%;
  }

  /* 分享浮层 */
  #shareModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: fadeIn .25s ease;
  }
  #shareModal.show { display: flex; }
  .share-card {
    background: linear-gradient(150deg, #1e1e2a, #15151d);
    border: 1px solid #33334a;
    border-radius: 24px;
    padding: 32px 26px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    position: relative;
  }
  .share-card .sc-badge {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .share-card .sc-name {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 12px;
  }
  .share-card .sc-tag {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.7;
    margin-bottom: 22px;
  }
  .share-card .sc-foot {
    font-size: 12px;
    color: #55556a;
    border-top: 1px solid #2a2a38;
    padding-top: 16px;
  }
  .share-close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: none;
    border: none;
    color: #55556a;
    font-size: 22px;
    cursor: pointer;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 人格主题色变量由JS注入 */
</style>
</head>
<body>
<div class="app">

  <!-- ========== 封面 ========== -->
  <section id="cover">
    <div class="cover-badge">后 会 友 期 · 趣 味 测 评</div>
    <h1 class="cover-title">你是后会友期里的谁</h1>
    <p class="cover-sub">
      45 道生活化小题，凭直觉选<br>
      看看你藏着<em>哪一种人格底色</em>
    </p>
    <div class="cover-names">
      <span>厉娜</span><span>许飞</span><span>青稚</span>
      <span>白小纯</span><span>马天宇</span><span>张萌</span>
    </div>
    <button class="btn-start" onclick="startQuiz()">开始测评</button>
    <p class="cover-meta">约 3 分钟 · 全部单选 · 无对错</p>
  </section>

  <!-- ========== 答题 ========== -->
  <section id="quiz">
    <div class="quiz-top">
      <div class="quiz-progress-text"><b id="curNum">1</b> / 45</div>
      <div class="quiz-pct" id="pctText">0%</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="q-number" id="qNumber">QUESTION 01</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="options"></div>
    <div class="quiz-nav">
      <button class="btn-nav btn-prev" id="btnPrev" onclick="prevQuestion()">上一题</button>
      <button class="btn-nav btn-next" id="btnNext" onclick="nextQuestion()" disabled>下一题</button>
    </div>
  </section>

  <!-- ========== 结果 ========== -->
  <section id="result">
    <div class="result-hero">
      <div class="result-label">你 是</div>
      <div class="result-name" id="resName"></div>
      <div class="result-tag" id="resTag"></div>
      <div class="result-score">总分 <b id="resScore"></b> / 180</div>
    </div>

    <div class="chart-card">
      <div class="chart-title">你的天赋分布</div>
      <div id="chartBars"></div>
    </div>

    <div class="content-card">
      <h3><span class="ico">📖</span>核心人格解读</h3>
      <p id="resCore"></p>
    </div>

    <div class="content-card">
      <h3><span class="ico">✨</span>性格优势亮点</h3>
      <ul id="resStrength"></ul>
    </div>

    <div class="content-card warn">
      <h3><span class="ico">⚠️</span>隐藏短板盲区</h3>
      <ul id="resWeak"></ul>
    </div>

    <div class="content-card">
      <h3><span class="ico">🤝</span>适配友情方向</h3>
      <p id="resMatch"></p>
    </div>

    <div class="content-card advice">
      <h3><span class="ico">🚀</span>可落地提升建议</h3>
      <ul id="resAdvice"></ul>
    </div>

    <div class="share-section">
      <button class="btn-share" onclick="openShare()">生成分享卡片</button>
      <button class="btn-restart" onclick="restartQuiz()">重新测一次</button>
    </div>
  </section>

</div>

<!-- ========== 分享浮层 ========== -->
<div id="shareModal" onclick="closeShare(event)">
  <div class="share-card" onclick="event.stopPropagation()">
    <button class="share-close" onclick="closeShare()">×</button>
    <div class="sc-badge">后 会 友 期 · 人 格 测 评</div>
    <div class="sc-name" id="scName"></div>
    <div class="sc-tag" id="scTag"></div>
    <div class="sc-foot">你是后会友期里的谁？也来测测看</div>
  </div>
</div>

<script>
/* =========================================================
   一、题库（45题）
   每题4个选项，分值固定：A=1, B=2, C=3, D=4
   ========================================================= */
const QUESTIONS = [
  { q: "朋友约你周末出门，但你那天其实只想躺着。你会：", opts: [
    { t: "直接说“不想动，改天吧”", v: 1 },
    { t: "纠结一会儿，最后还是去了", v: 2 },
    { t: "找个借口推掉，心里有点过意不去", v: 3 },
    { t: "去，但全程盼着早点回家", v: 4 }
  ]},
  { q: "群里有人发了很长一段情绪宣泄，你的第一反应：", opts: [
    { t: "划过去，不知道该说啥", v: 1 },
    { t: "看完，在心里默默关心一下", v: 2 },
    { t: "发个表情包缓和气氛", v: 3 },
    { t: "认真回复，试着安慰或帮分析", v: 4 }
  ]},
  { q: "你和朋友因为一件小事有了隔阂，你通常会：", opts: [
    { t: "过两天就忘了，该干嘛干嘛", v: 1 },
    { t: "记在心里，但不会主动提", v: 2 },
    { t: "找机会用玩笑的方式点一下", v: 3 },
    { t: "憋不住，直接问“你那天是不是对我不满”", v: 4 }
  ]},
  { q: "同事/同学聚餐，聊到一个你完全不懂的话题：", opts: [
    { t: "低头吃饭，刷手机", v: 1 },
    { t: "听他们聊，偶尔点头", v: 2 },
    { t: "找机会把话题引到自己熟悉的领域", v: 3 },
    { t: "直接问“这是什么意思啊”，不装懂", v: 4 }
  ]},
  { q: "你发现自己被朋友移出了一个小群：", opts: [
    { t: "哦，可能建错了", v: 1 },
    { t: "有点在意，但不会去问", v: 2 },
    { t: "截图问另一个朋友“你知道这事吗”", v: 3 },
    { t: "直接问当事人“我是不是哪里得罪你了”", v: 4 }
  ]},
  { q: "朋友找你帮忙，但你自己手头也很紧/很忙：", opts: [
    { t: "直接说不行，不绕弯", v: 1 },
    { t: "犹豫一下，说“我尽量”", v: 2 },
    { t: "勉强答应，心里有点不舒服", v: 3 },
    { t: "解释清楚原因，让对方理解", v: 4 }
  ]},
  { q: "你和朋友吵架后，谁先低头？", opts: [
    { t: "看谁错，我错我认，他错我等", v: 1 },
    { t: "过几天自然就好了，不用谁低头", v: 2 },
    { t: "我会先给台阶，但心里记着", v: 3 },
    { t: "我会主动说清楚，不想拖着", v: 4 }
  ]},
  { q: "朋友在朋友圈发了一条很丧的内容：", opts: [
    { t: "点个赞表示看到了", v: 1 },
    { t: "私聊问一句“咋了”", v: 2 },
    { t: "评论里开个玩笑逗他", v: 3 },
    { t: "直接打电话过去", v: 4 }
  ]},
  { q: "你对“朋友之间应该无话不说”这句话：", opts: [
    { t: "不同意，谁没点自己的事", v: 1 },
    { t: "看情况，有些事不说反而好", v: 2 },
    { t: "理论上同意，但自己做不到", v: 3 },
    { t: "同意，好朋友就该坦诚", v: 4 }
  ]},
  { q: "有人当着别人的面开了你一个不太舒服的玩笑：", opts: [
    { t: "当场怼回去", v: 1 },
    { t: "笑一下，但心里不舒服", v: 2 },
    { t: "事后私聊告诉他“下次别这样”", v: 3 },
    { t: "忍着，回去越想越气", v: 4 }
  ]},
  { q: "你更接近哪种状态？", opts: [
    { t: "今天的事今天翻篇，不带到明天", v: 1 },
    { t: "有事记着，但不常翻出来", v: 2 },
    { t: "嘴上说没事，心里会复盘很久", v: 3 },
    { t: "反复想，直到想明白为止", v: 4 }
  ]},
  { q: "朋友介绍新朋友给你认识，你的态度：", opts: [
    { t: "无所谓，能聊就聊", v: 1 },
    { t: "礼貌客气，不主动深交", v: 2 },
    { t: "观察一下，看合不合得来", v: 3 },
    { t: "热情回应，多个朋友多条路", v: 4 }
  ]},
  { q: "你答应了一件事，后来发现自己做不到：", opts: [
    { t: "直接说“我搞不定，你找别人吧”", v: 1 },
    { t: "硬着头皮做完，哪怕很累", v: 2 },
    { t: "提前说清楚，给个替代方案", v: 3 },
    { t: "很内疚，反复道歉", v: 4 }
  ]},
  { q: "你心里有事的时候，会：", opts: [
    { t: "该吃吃该睡睡，事是事，觉是觉", v: 1 },
    { t: "找点事做分散注意力", v: 2 },
    { t: "想找人说说，但最后没说", v: 3 },
    { t: "一定要找个人聊透", v: 4 }
  ]},
  { q: "朋友做了让你不舒服的事，但你还没说：", opts: [
    { t: "不说，下次注意就行", v: 1 },
    { t: "等合适的时机再提", v: 2 },
    { t: "暗示一下，看他能不能懂", v: 3 },
    { t: "憋不住，找机会直说", v: 4 }
  ]},
